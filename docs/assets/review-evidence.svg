<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" width="1240" height="690" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Evidence: everything collected before any AI</title>
<desc id="desc">Read once from what the browser captured; the field specialists, and later the models, only ever see this.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1240" height="690" fill="#f1f5f9"/>
<text x="40" y="52" font-size="26" font-weight="800" fill="#0b1f3a">Evidence: everything collected before any AI</text>
<text x="40" y="78" font-size="14" fill="#334155">Read once from what the browser captured; the field specialists, and later the models, only ever see this.</text>
<rect x="340" y="100" width="860" height="550" rx="14" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="356" y="124" font-size="14" font-weight="700" fill="#0b1f3a">The evidence</text>
<path d="M290.0 345.0 L340.0 345.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M680.0 333.0 L730.0 333.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M630.0 576.0 L680.0 576.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M950.0 576.0 L1000.0 576.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="300" width="250" height="90" rx="12" fill="#0b1f3a" stroke="#0b1f3a" stroke-width="1.5"/>
<text x="165.0" y="330.0" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">What the browser captured</text>
<text x="165.0" y="352.0" text-anchor="middle" font-size="13.5" fill="#cbd5e1">the page, its images,</text>
<text x="165.0" y="371.0" text-anchor="middle" font-size="13.5" fill="#cbd5e1">its text, a screenshot</text>
<rect x="360" y="168" width="154" height="86" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="437.0" y="196.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Tags</text>
<text x="437.0" y="218.0" text-anchor="middle" font-size="13.5" fill="#334155">title, site name,</text>
<text x="437.0" y="237.0" text-anchor="middle" font-size="13.5" fill="#334155">sharing tags</text>
<rect x="526" y="168" width="154" height="86" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="603.0" y="196.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Structured data</text>
<text x="603.0" y="218.0" text-anchor="middle" font-size="13.5" fill="#334155">name, logo, phone,</text>
<text x="603.0" y="237.0" text-anchor="middle" font-size="13.5" fill="#334155">address, profiles</text>
<rect x="692" y="168" width="154" height="86" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="769.0" y="205.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Language</text>
<text x="769.0" y="227.5" text-anchor="middle" font-size="13.5" fill="#334155">of the page</text>
<rect x="858" y="168" width="154" height="86" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="935.0" y="196.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Links</text>
<text x="935.0" y="218.0" text-anchor="middle" font-size="13.5" fill="#334155">social profiles,</text>
<text x="935.0" y="237.0" text-anchor="middle" font-size="13.5" fill="#334155">contact pages</text>
<rect x="1024" y="168" width="154" height="86" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1101.0" y="196.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Platform page</text>
<text x="1101.0" y="218.0" text-anchor="middle" font-size="13.5" fill="#334155">the business&#x27;s name</text>
<text x="1101.0" y="237.0" text-anchor="middle" font-size="13.5" fill="#334155">there, its website</text>
<rect x="360" y="298" width="320" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="520.0" y="327.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Text by area</text>
<text x="520.0" y="349.5" text-anchor="middle" font-size="13.5" fill="#334155">header, main content, footer</text>
<rect x="730" y="298" width="260" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="860.0" y="327.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Postcodes</text>
<text x="860.0" y="349.5" text-anchor="middle" font-size="13.5" fill="#334155">provinces and states</text>
<rect x="360" y="412" width="400" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="560.0" y="441.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Logo candidates</text>
<text x="560.0" y="463.5" text-anchor="middle" font-size="13.5" fill="#334155">every image the page drew, ranked and numbered</text>
<rect x="360" y="526" width="270" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="495.0" y="561.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">First guess at the country</text>
<text x="495.0" y="583.0" text-anchor="middle" font-size="13.5" fill="#334155">from the structured data,</text>
<text x="495.0" y="602.0" text-anchor="middle" font-size="13.5" fill="#334155">the postcodes and the language</text>
<rect x="680" y="526" width="270" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="815.0" y="551.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Contacts</text>
<text x="815.0" y="573.5" text-anchor="middle" font-size="13.5" fill="#334155">phones read for that country,</text>
<text x="815.0" y="592.5" text-anchor="middle" font-size="13.5" fill="#334155">where each was found, emails,</text>
<text x="815.0" y="611.5" text-anchor="middle" font-size="13.5" fill="#334155">the copyright line</text>
<rect x="1000" y="526" width="180" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1090.0" y="561.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Countries again</text>
<text x="1090.0" y="583.0" text-anchor="middle" font-size="13.5" fill="#334155">with the phones&#x27;</text>
<text x="1090.0" y="602.0" text-anchor="middle" font-size="13.5" fill="#334155">area codes as clues</text>
<text x="360" y="156" font-size="13" font-weight="700" fill="#475569">Read from the page&#x27;s code</text>
<text x="360" y="286" font-size="13" font-weight="700" fill="#475569">Read from the visible text</text>
<text x="360" y="400" font-size="13" font-weight="700" fill="#475569">Read from the images</text>
<text x="360" y="514" font-size="13" font-weight="700" fill="#475569">Worked out from those</text>
</svg>
