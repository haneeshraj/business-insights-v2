<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 780" width="1300" height="780" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">How the parts fit together</title>
<desc id="desc">As it stood on 2026-10-12: the part that works out the answers reaches the outside world only through plugs.</desc>
