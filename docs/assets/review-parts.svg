<rect x="60" y="140" width="190" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="155.0" y="165.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Terminal app</text>
<text x="155.0" y="187.0" text-anchor="middle" font-size="13.5" fill="#334155">analyze sites,</text>
<text x="155.0" y="206.0" text-anchor="middle" font-size="13.5" fill="#334155">check results</text>
<rect x="60" y="250" width="190" height="80" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="155.0" y="284.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Website demo</text>
<text x="155.0" y="306.5" text-anchor="middle" font-size="13.5" fill="#334155">(later)</text>
<rect x="320" y="125" width="220" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="430.0" y="165.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Sets up each run</text>
<text x="430.0" y="187.0" text-anchor="middle" font-size="13.5" fill="#334155">plugs in the real browser,</text>
<text x="430.0" y="206.0" text-anchor="middle" font-size="13.5" fill="#334155">the downloader and storage</text>
<rect x="610" y="148" width="400" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="810.0" y="174.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Runs one site</text>
<text x="810.0" y="196.5" text-anchor="middle" font-size="13.5" fill="#334155">from start to finish</text>
<rect x="610" y="250" width="190" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="705.0" y="289.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Collects evidence</text>
<text x="705.0" y="311.5" text-anchor="middle" font-size="13.5" fill="#334155">from the page</text>
<rect x="820" y="250" width="190" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="915.0" y="289.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Decides each field</text>
<text x="915.0" y="311.5" text-anchor="middle" font-size="13.5" fill="#334155">and how sure it is</text>
<rect x="1075" y="160" width="170" height="160" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1160.0" y="215.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Data shapes</text>
<text x="1160.0" y="237.5" text-anchor="middle" font-size="13.5" fill="#334155">every piece of data&#x27;s</text>
<text x="1160.0" y="256.5" text-anchor="middle" font-size="13.5" fill="#334155">shape, and the rules</text>
<text x="1160.0" y="275.5" text-anchor="middle" font-size="13.5" fill="#334155">it must follow</text>
<rect x="330" y="482" width="200" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="430.0" y="521.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">A real browser</text>
<text x="430.0" y="543.5" text-anchor="middle" font-size="13.5" fill="#334155">loads and reads pages</text>
<rect x="560" y="482" width="200" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="660.0" y="512.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">A downloader</text>
<text x="660.0" y="534.0" text-anchor="middle" font-size="13.5" fill="#334155">fetches logo files</text>
<text x="660.0" y="553.0" text-anchor="middle" font-size="13.5" fill="#334155">safely</text>
<rect x="790" y="482" width="200" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="890.0" y="512.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Storage</text>
<text x="890.0" y="534.0" text-anchor="middle" font-size="13.5" fill="#334155">keeps results</text>
<text x="890.0" y="553.0" text-anchor="middle" font-size="13.5" fill="#334155">and files</text>
