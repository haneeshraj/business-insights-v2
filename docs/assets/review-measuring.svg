<path d="M1130.0 326.0 L1155.0 326.0 L1155.0 300.0 L1180.0 300.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1130.0 354.0 L1155.0 354.0 L1155.0 405.0 L1180.0 405.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="200" width="250" height="92" rx="12" fill="#0b1f3a" stroke="#0b1f3a" stroke-width="1.5"/>
<text x="165.0" y="231.0" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">The gold set</text>
<text x="165.0" y="253.0" text-anchor="middle" font-size="13.5" fill="#cbd5e1">56 sites with answers</text>
<text x="165.0" y="272.0" text-anchor="middle" font-size="13.5" fill="#cbd5e1">a person confirmed</text>
<rect x="330" y="200" width="250" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="455.0" y="240.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Load each site once,</text>
<text x="455.0" y="262.5" text-anchor="middle" font-size="13.5" fill="#334155">and save the pages</text>
<path d="M620 215 v62 a85.0 9 0 0 0 170 0 v-62" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<ellipse cx="705.0" cy="215" rx="85.0" ry="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="705.0" y="254.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Saved pages</text>
<rect x="840" y="110" width="290" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="985.0" y="141.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Coverage</text>
<text x="985.0" y="163.0" text-anchor="middle" font-size="13.5" fill="#334155">is the right answer somewhere</text>
<text x="985.0" y="182.0" text-anchor="middle" font-size="13.5" fill="#334155">in the evidence?</text>
<rect x="840" y="300" width="290" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="985.0" y="334.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Analysis</text>
<text x="985.0" y="356.5" text-anchor="middle" font-size="13.5" fill="#334155">the final answers</text>
<rect x="1180" y="126" width="200" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
