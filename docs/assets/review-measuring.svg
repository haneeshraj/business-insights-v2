<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 470" width="1420" height="470" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Measuring it</title>
<desc id="desc">Each gold site is loaded once and its pages saved, so every later run is offline, free and the same.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1420" height="470" fill="#f1f5f9"/>
<text x="40" y="52" font-size="26" font-weight="800" fill="#0b1f3a">Measuring it</text>
<text x="40" y="78" font-size="14" fill="#334155">Each gold site is loaded once and its pages saved, so every later run is offline, free and the same.</text>
<path d="M290.0 246.0 L330.0 246.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M580.0 246.0 L620.0 246.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
