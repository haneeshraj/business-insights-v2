<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">The layers</title>
<desc id="desc">Each layer may use the ones below it, never the ones beside or above it.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="560" fill="#f1f5f9"/>
<text x="40" y="52" font-size="26" font-weight="800" fill="#0b1f3a">The layers</text>
<text x="40" y="78" font-size="14" fill="#334155">Each layer may use the ones below it, never the ones beside or above it.</text>
<path d="M370.0 186.0 L370.0 222.0 L250.0 222.0 L250.0 260.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M590.0 186.0 L590.0 222.0 L710.0 222.0 L710.0 260.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M250.0 356.0 L250.0 394.0 L370.0 394.0 L370.0 430.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M710.0 356.0 L710.0 394.0 L590.0 394.0 L590.0 430.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="260" y="110" width="440" height="76" rx="12" fill="#0b1f3a" stroke="#0b1f3a" stroke-width="1.5"/>
<text x="480.0" y="142.5" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Commands people run</text>
<text x="480.0" y="164.5" text-anchor="middle" font-size="13.5" fill="#cbd5e1">and the setup for each run</text>
<rect x="60" y="260" width="380" height="96" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="60" y="260" width="10" height="96" rx="5" fill="#0891b2"/>
<text x="250.0" y="302.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Working out the answers</text>
<text x="250.0" y="324.5" text-anchor="middle" font-size="13.5" fill="#334155">collecting evidence, deciding fields</text>
<rect x="520" y="260" width="380" height="96" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="520" y="260" width="10" height="96" rx="5" fill="#7c3aed"/>
<text x="710.0" y="293.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Talking to the outside world</text>
<text x="710.0" y="315.0" text-anchor="middle" font-size="13.5" fill="#334155">browser, downloads, storage;</text>
<text x="710.0" y="334.0" text-anchor="middle" font-size="13.5" fill="#334155">later AI models and search</text>
<rect x="260" y="430" width="440" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="260" y="430" width="10" height="92" rx="5" fill="#16a34a"/>
<text x="480.0" y="470.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Shared building blocks</text>
<text x="480.0" y="492.5" text-anchor="middle" font-size="13.5" fill="#334155">data shapes, rules, settings, plugs</text>
