<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 1090" width="970" height="1090" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Loading a page</title>
<desc id="desc">The fast browser first; a full browser only when a site refuses it.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="970" height="1090" fill="#f1f5f9"/>
<text x="40" y="52" font-size="26" font-weight="800" fill="#0b1f3a">Loading a page</text>
<text x="40" y="78" font-size="14" fill="#334155">The fast browser first; a full browser only when a site refuses it.</text>
<path d="M370.0 152.0 L370.0 190.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M530.0 220.0 L630.0 220.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M370.0 250.0 L370.0 296.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M370.0 352.0 L370.0 390.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M370.0 460.0 L370.0 500.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M550.0 542.0 L630.0 542.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M370.0 584.0 L370.0 630.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M770.0 572.0 L770.0 665.0 L550.0 665.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M370.0 700.0 L370.0 740.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M370.0 804.0 L370.0 850.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M370.0 934.0 L370.0 1000.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M550.0 892.0 L620.0 892.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M775.0 927.0 L775.0 1028.0 L490.0 1028.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="250" y="100" width="240" height="52" rx="12" fill="#0b1f3a" stroke="#0b1f3a" stroke-width="1.5"/>
<text x="370.0" y="130.0" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">A website address</text>
<rect x="210" y="190" width="320" height="60" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
<circle cx="232" cy="220.0" r="11" fill="#2563eb"/>
<text x="232" y="225.0" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">?</text>
<text x="385.0" y="224.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">On the public internet?</text>
<rect x="630" y="194" width="260" height="52" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
<text x="760.0" y="224.0" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">Refused, for safety</text>
<rect x="220" y="296" width="300" height="56" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="370.0" y="328.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Load it in the fast browser</text>
<rect x="190" y="390" width="360" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="370.0" y="419.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Wait for the page to load,</text>
<text x="370.0" y="441.5" text-anchor="middle" font-size="13.5" fill="#334155">then for its network activity to settle</text>
<rect x="190" y="500" width="360" height="84" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
<circle cx="212" cy="542.0" r="11" fill="#2563eb"/>
<text x="212" y="547.0" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">?</text>
<text x="385.0" y="527.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Is a bot check running?</text>
<text x="385.0" y="549.0" text-anchor="middle" font-size="13.5" fill="#1e40af">an error page with scripts,</text>
<text x="385.0" y="568.0" text-anchor="middle" font-size="13.5" fill="#1e40af">or a known check page</text>
<rect x="630" y="512" width="280" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="770.0" y="536.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Give it up to 10 seconds</text>
<text x="770.0" y="558.5" text-anchor="middle" font-size="13.5" fill="#334155">to pass</text>
<rect x="190" y="630" width="360" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="370.0" y="659.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Scroll to the bottom and back,</text>
<text x="370.0" y="681.5" text-anchor="middle" font-size="13.5" fill="#334155">reading the text at the bottom too</text>
<rect x="190" y="740" width="360" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="370.0" y="766.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Read everything in one go,</text>
<text x="370.0" y="788.5" text-anchor="middle" font-size="13.5" fill="#334155">and take the screenshot</text>
<rect x="190" y="850" width="360" height="84" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
<circle cx="212" cy="892.0" r="11" fill="#2563eb"/>
<text x="212" y="897.0" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">?</text>
<text x="385.0" y="877.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Did the site refuse?</text>
<text x="385.0" y="899.0" text-anchor="middle" font-size="13.5" fill="#1e40af">still a check page, an error,</text>
<text x="385.0" y="918.0" text-anchor="middle" font-size="13.5" fill="#1e40af">or a dropped connection</text>
<rect x="620" y="857" width="310" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="775.0" y="886.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Load it again in a full browser</text>
<text x="775.0" y="908.5" text-anchor="middle" font-size="13.5" fill="#334155">Chromium, else Chrome, else Edge</text>
<rect x="250" y="1000" width="240" height="56" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="370.0" y="1032.0" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">What the browser captured</text>
<rect x="565.4" y="208.0" width="29.2" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="580.0" y="225.0" text-anchor="middle" font-size="12.5" fill="#475569">no</text>
<rect x="352.1" y="261.0" width="35.8" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="370.0" y="278.0" text-anchor="middle" font-size="12.5" fill="#475569">yes</text>
<rect x="572.1" y="530.0" width="35.8" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="590.0" y="547.0" text-anchor="middle" font-size="12.5" fill="#475569">yes</text>
<rect x="355.4" y="595.0" width="29.2" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="370.0" y="612.0" text-anchor="middle" font-size="12.5" fill="#475569">no</text>
<rect x="355.4" y="955.0" width="29.2" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="370.0" y="972.0" text-anchor="middle" font-size="12.5" fill="#475569">no</text>
<rect x="567.1" y="880.0" width="35.8" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="585.0" y="897.0" text-anchor="middle" font-size="12.5" fill="#475569">yes</text>
</svg>
