<rect x="330" y="100" width="360" height="56" rx="12" fill="#0b1f3a" stroke="#0b1f3a" stroke-width="1.5"/>
<text x="510.0" y="132.0" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Images ranked by how logo-like they are</text>
<rect x="280" y="200" width="460" height="84" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
<circle cx="302" cy="242.0" r="11" fill="#2563eb"/>
<text x="302" y="247.0" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">?</text>
<text x="525.0" y="227.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Is the top one drawn in the page,</text>
<text x="525.0" y="249.0" text-anchor="middle" font-size="13.5" fill="#1e40af">with no file of its own, while</text>
<text x="525.0" y="268.0" text-anchor="middle" font-size="13.5" fill="#1e40af">the page names a logo file?</text>
<rect x="110" y="330" width="270" height="56" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="245.0" y="362.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Try the named logo file first</text>
<rect x="640" y="330" width="270" height="56" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="775.0" y="362.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Try the top image</text>
<rect x="380" y="440" width="260" height="60" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
<circle cx="402" cy="470.0" r="11" fill="#2563eb"/>
<text x="402" y="475.0" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">?</text>
<text x="525.0" y="474.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Does it have a file?</text>
<rect x="90" y="570" width="350" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="265.0" y="597.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Download it safely</text>
<text x="265.0" y="619.0" text-anchor="middle" font-size="13.5" fill="#334155">public addresses only, redirects checked,</text>
<text x="265.0" y="638.0" text-anchor="middle" font-size="13.5" fill="#334155">at most 5 MB</text>
<rect x="600" y="584" width="300" height="56" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="750.0" y="616.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Cut it out of the screenshot</text>
<rect x="310" y="710" width="400" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="510.0" y="739.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Look at the bytes</text>
<text x="510.0" y="761.5" text-anchor="middle" font-size="13.5" fill="#334155">what kind of image it really is, and its size</text>
<rect x="370" y="830" width="280" height="56" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
<circle cx="392" cy="858.0" r="11" fill="#2563eb"/>
<text x="392" y="863.0" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">?</text>
<text x="525.0" y="862.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">A logo&#x27;s shape and size?</text>
<rect x="740" y="816" width="280" height="84" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="880.0" y="843.0" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">Try the next image, up to 3,</text>
<text x="880.0" y="865.0" text-anchor="middle" font-size="13.5" fill="#92400e">each one lowering</text>
<text x="880.0" y="884.0" text-anchor="middle" font-size="13.5" fill="#92400e">the confidence</text>
<rect x="370" y="950" width="280" height="56" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="510.0" y="982.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Save it with its real file type</text>
<rect x="310" y="1060" width="400" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="510.0" y="1089.5" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">The logo</text>
<text x="510.0" y="1111.5" text-anchor="middle" font-size="13.5" fill="#166534">its address, the saved file, and the site&#x27;s app icon</text>
<rect x="227.1" y="288.0" width="35.8" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="245.0" y="305.0" text-anchor="middle" font-size="12.5" fill="#475569">yes</text>
<rect x="760.4" y="288.0" width="29.2" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="775.0" y="305.0" text-anchor="middle" font-size="12.5" fill="#475569">no</text>
<rect x="339.1" y="523.0" width="35.8" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="357.0" y="540.0" text-anchor="middle" font-size="12.5" fill="#475569">yes</text>
<rect x="645.4" y="523.0" width="29.2" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="660.0" y="540.0" text-anchor="middle" font-size="12.5" fill="#475569">no</text>
<rect x="680.4" y="846.0" width="29.2" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="695.0" y="863.0" text-anchor="middle" font-size="12.5" fill="#475569">no</text>
<text x="740" y="922" font-size="12.5" fill="#475569">no: not an image, a tracking pixel,</text>
<text x="740" y="939" font-size="12.5" fill="#475569">under 16 pixels, a long strip,</text>
<text x="740" y="956" font-size="12.5" fill="#475569">or photo-sized</text>
<rect x="492.1" y="906.0" width="35.8" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="510.0" y="923.0" text-anchor="middle" font-size="12.5" fill="#475569">yes</text>
