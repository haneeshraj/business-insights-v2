<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1170" width="1080" height="1170" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">The logo, step by step</title>
<desc id="desc">As it stood on 2026-10-12, before Jev and Gemini joined: the rules&#x27; ranking does the work.</desc>
