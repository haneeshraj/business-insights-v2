<rect x="430" y="100" width="240" height="52" rx="12" fill="#0b1f3a" stroke="#0b1f3a" stroke-width="1.5"/>
<text x="550.0" y="130.0" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">A website address</text>
<rect x="410" y="190" width="280" height="56" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="550.0" y="222.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Load the page in a real browser</text>
<rect x="330" y="300" width="440" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="550.0" y="331.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">What the browser captured</text>
<text x="550.0" y="353.0" text-anchor="middle" font-size="13.5" fill="#334155">the page, its images and where they sit,</text>
<text x="550.0" y="372.0" text-anchor="middle" font-size="13.5" fill="#334155">its text by area, a screenshot</text>
<rect x="820" y="300" width="260" height="92" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
<text x="950.0" y="331.0" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">A failed result</text>
<text x="950.0" y="353.0" text-anchor="middle" font-size="13.5" fill="#991b1b">every field is an error,</text>
<text x="950.0" y="372.0" text-anchor="middle" font-size="13.5" fill="#991b1b">with the reason</text>
<rect x="410" y="440" width="280" height="56" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="550.0" y="462.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Collect the evidence</text>
<text x="550.0" y="484.5" text-anchor="middle" font-size="13.5" fill="#334155">no AI</text>
<rect x="40" y="560" width="196" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="138.0" y="596.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Decide the name</text>
<rect x="252" y="560" width="196" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="350.0" y="596.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Decide the logo</text>
<rect x="464" y="560" width="196" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="562.0" y="596.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Decide the phone</text>
<rect x="676" y="560" width="196" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="774.0" y="596.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Decide the social links</text>
<rect x="888" y="560" width="196" height="64" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="986.0" y="586.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">MCC and address</text>
<text x="986.0" y="608.5" text-anchor="middle" font-size="13.5" fill="#334155">not built yet</text>
<rect x="330" y="690" width="440" height="92" rx="12" fill="#0b1f3a" stroke="#0b1f3a" stroke-width="1.5"/>
<text x="550.0" y="721.0" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">One result for the site</text>
<text x="550.0" y="743.0" text-anchor="middle" font-size="13.5" fill="#cbd5e1">each field with its answer, status,</text>
<text x="550.0" y="762.0" text-anchor="middle" font-size="13.5" fill="#cbd5e1">confidence and reasons</text>
<rect x="110" y="830" width="260" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="240.0" y="856.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">A results file</text>
<text x="240.0" y="878.5" text-anchor="middle" font-size="13.5" fill="#334155">for scoring</text>
<rect x="420" y="830" width="260" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="550.0" y="856.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">A folder per site</text>
<text x="550.0" y="878.5" text-anchor="middle" font-size="13.5" fill="#334155">result, evidence, screenshot, logo</text>
<rect x="730" y="830" width="260" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="860.0" y="856.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">The report page</text>
<text x="860.0" y="878.5" text-anchor="middle" font-size="13.5" fill="#334155">the answers beside the evidence</text>
<rect x="110" y="926" width="260" height="52" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="240.0" y="956.0" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Score against the gold set</text>
<rect x="522.2" y="261.0" width="55.6" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="550.0" y="278.0" text-anchor="middle" font-size="12.5" fill="#475569">loaded</text>
<rect x="769.1" y="206.0" width="101.8" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="820.0" y="223.0" text-anchor="middle" font-size="12.5" fill="#475569">couldn&#x27;t load</text>
