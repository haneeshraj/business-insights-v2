<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1000" width="1120" height="1000" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">What happens when you analyze a site</title>
<desc id="desc">As it stood on 2026-10-12, before the MCC and the address were built.</desc>
