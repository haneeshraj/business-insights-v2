<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">bi2 architecture</title>
  <desc id="desc">A website goes through a browser, then evidence built with no model, then seven field specialists in parallel. Each specialist climbs a ladder from free rules to Jev, Gemini and a web-search investigator only when it isn't sure.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .dark { fill: #0b1f3a; }
      .title { font-size: 19px; font-weight: 700; fill: #0b1f3a; }
      .small { font-size: 14px; fill: #334155; }
      .tiny { font-size: 12.5px; fill: #475569; }
      .white { fill: #f8fafc; }
      .line { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; }
    </style>
  </defs>
  <rect width="1200" height="780" fill="#f1f5f9"/>
  <text x="40" y="52" font-size="28" font-weight="800" fill="#0b1f3a">bi2: evidence first, models last</text>
  <text x="40" y="80" class="small">The normal path is a fixed workflow. A model is asked only about an answer the rules aren't sure of, and only with the evidence that answer needs.</text>

  <!-- The workflow, top to bottom -->
  <rect x="40" y="110" width="330" height="62" rx="12" class="dark"/>
  <text x="62" y="138" class="title white" style="fill:#f8fafc">A website address</text>
  <text x="62" y="160" class="tiny" style="fill:#cbd5e1">or a business's page on a platform, like Instagram</text>

  <rect x="40" y="200" width="330" height="96" rx="12" class="box"/>
  <text x="62" y="228" class="title">Collector</text>
  <text x="62" y="252" class="small">Playwright's fast shell, then a full browser</text>
  <text x="62" y="272" class="small">when a site refuses it; the contact page only</text>
  <text x="62" y="290" class="small">when the homepage lacks contact details</text>

  <rect x="40" y="324" width="330" height="118" rx="12" class="box"/>
  <text x="62" y="352" class="title">Evidence, with no model</text>
  <text x="62" y="376" class="small">structured data, meta tags, logo candidates</text>
  <text x="62" y="396" class="small">with boxes on the screenshot, phones, emails,</text>
  <text x="62" y="416" class="small">postcodes, links, countries, text by region;</text>
  <text x="62" y="436" class="small">Wikidata's facts about big brands</text>

  <rect x="40" y="470" width="330" height="140" rx="12" class="box"/>
  <text x="62" y="498" class="title">Seven field specialists</text>
  <text x="62" y="522" class="small">run at the same time, each a cascade:</text>
  <text x="62" y="548" class="small" font-weight="600">name · logo · MCC · address</text>
  <text x="62" y="570" class="small" font-weight="600">phone · email · social links</text>
  <text x="62" y="596" class="tiny">every step recorded: why it passed on, what it cost</text>

  <rect x="40" y="638" width="330" height="100" rx="12" class="dark"/>
  <text x="62" y="666" class="title" style="fill:#f8fafc">SiteResult</text>
  <text x="62" y="690" class="tiny" style="fill:#cbd5e1">each field: value, status (ok, needs review,</text>
  <text x="62" y="708" class="tiny" style="fill:#cbd5e1">not found, error), confidence, source, evidence,</text>
  <text x="62" y="726" class="tiny" style="fill:#cbd5e1">audit trail; address with map coordinates</text>

  <path class="line" d="M205 172V196"/>
  <path class="line" d="M205 296V320"/>
  <path class="line" d="M205 442V466"/>
  <path class="line" d="M205 610V634"/>

  <!-- The escalation ladder -->
  <text x="440" y="130" class="title">Each specialist climbs only as far as it must</text>
  <path class="line" d="M370 540C400 540 410 190 436 190"/>

  <rect x="440" y="150" width="440" height="78" rx="12" class="box"/>
  <rect x="440" y="150" width="10" height="78" rx="5" fill="#16a34a"/>
  <text x="468" y="178" class="title">1. Rules</text>
  <text x="468" y="202" class="small">free, instant: places that agree, structured data,</text>
  <text x="468" y="220" class="small">a postcode with a house number</text>

  <rect x="440" y="256" width="440" height="96" rx="12" class="box"/>
  <rect x="440" y="256" width="10" height="96" rx="5" fill="#0891b2"/>
  <text x="468" y="284" class="title">2. Jev, a typed decision</text>
  <text x="468" y="308" class="small">picks among the rules' own candidates, with a</text>
  <text x="468" y="326" class="small">probability: the logo box, the MCC, the main phone.</text>
  <text x="468" y="344" class="tiny">0.3 to 0.6 s a call, about $0.00002; it can't make an answer up</text>

  <rect x="440" y="380" width="440" height="96" rx="12" class="box"/>
  <rect x="440" y="380" width="10" height="96" rx="5" fill="#7c3aed"/>
  <text x="468" y="408" class="title">3. Gemini, a generation</text>
  <text x="468" y="432" class="small">reads a name or an address off the page, and</text>
  <text x="468" y="450" class="small">must quote it; a second opinion on logos; Jev's backup</text>
  <text x="468" y="468" class="tiny">only when Jev can't settle it</text>

  <rect x="440" y="504" width="440" height="78" rx="12" class="box"/>
  <rect x="440" y="504" width="10" height="78" rx="5" fill="#ea580c"/>
  <text x="468" y="532" class="title">4. Investigator</text>
  <text x="468" y="556" class="small">a web search for what the pages never say, like a</text>
  <text x="468" y="574" class="small">chain's head office; its answer must cite its pages</text>

  <rect x="440" y="610" width="440" height="58" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="468" y="645" class="title">5. Needs review, with the best answer kept</text>

  <path class="line" d="M660 228V252"/>
  <path class="line" d="M660 352V376"/>
  <path class="line" d="M660 476V500"/>
  <path class="line" d="M660 582V606"/>
  <text x="895" y="196" class="tiny">sure: stop</text>
  <text x="895" y="306" class="tiny">sure: stop</text>
  <text x="895" y="430" class="tiny">sure: stop</text>
  <text x="895" y="546" class="tiny">found: stop</text>

  <!-- Shared services -->
  <rect x="960" y="150" width="200" height="518" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="980" y="180" class="title">Shared</text>
  <text x="980" y="212" class="small" font-weight="600">Free-tier limiter</text>
  <text x="980" y="232" class="tiny">per model: a minute, a day,</text>
  <text x="980" y="248" class="tiny">at once; counts kept on disk</text>
  <text x="980" y="282" class="small" font-weight="600">Kept answers</text>
  <text x="980" y="302" class="tiny">by a hash of the question:</text>
  <text x="980" y="318" class="tiny">a rerun asks no model</text>
  <text x="980" y="352" class="small" font-weight="600">Call log</text>
  <text x="980" y="372" class="tiny">tokens and dollars per call</text>
  <text x="980" y="406" class="small" font-weight="600">Site budget</text>
  <text x="980" y="426" class="tiny">at most 12 model calls</text>
  <text x="980" y="460" class="small" font-weight="600">Wikidata</text>
  <text x="980" y="480" class="tiny">big brands' logos, head offices</text>
  <text x="980" y="514" class="small" font-weight="600">Nominatim</text>
  <text x="980" y="534" class="tiny">coordinates, a postcode check</text>
  <text x="980" y="568" class="small" font-weight="600">Entry points</text>
  <text x="980" y="588" class="tiny">terminal app, MCP server,</text>
  <text x="980" y="604" class="tiny">nightly eval in CI</text>
  <path class="dash" d="M880 400H956"/>
</svg>
