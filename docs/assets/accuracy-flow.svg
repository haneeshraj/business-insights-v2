<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 740" width="1020" height="740" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Accurate answers: from free rules to AI to a person</title>
<desc id="desc">An answer the rules are sure of is kept; 1 in 20 of those is checked anyway, to catch rules that start to slip.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1020" height="740" fill="#f1f5f9"/>
<text x="40" y="52" font-size="26" font-weight="800" fill="#0b1f3a">Accurate answers: from free rules to AI to a person</text>
<text x="40" y="78" font-size="14" fill="#334155">An answer the rules are sure of is kept; 1 in 20 of those is checked anyway, to catch rules that start to slip.</text>
<path d="M510.0 152.0 L510.0 196.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M360.0 231.0 L175.0 231.0 L175.0 330.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M660.0 231.0 L820.0 231.0 L820.0 318.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M660.0 360.0 L510.0 360.0 L510.0 470.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M850.0 402.0 L850.0 464.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M205.0 390.0 L205.0 500.0 L400.0 500.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M135.0 390.0 L135.0 678.0 L390.0 678.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M510.0 530.0 L510.0 650.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M620.0 500.0 L720.0 500.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M850.0 538.0 L850.0 678.0 L630.0 678.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="100" width="260" height="52" rx="12" fill="#0b1f3a" stroke="#0b1f3a" stroke-width="1.5"/>
<text x="510.0" y="130.0" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">A website address</text>
<rect x="360" y="196" width="300" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="360" y="196" width="10" height="70" rx="5" fill="#16a34a"/>
<text x="510.0" y="225.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Free rules</text>
<text x="510.0" y="247.5" text-anchor="middle" font-size="13.5" fill="#334155">no AI, no tokens</text>
<rect x="60" y="330" width="230" height="60" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="175.0" y="364.0" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Kept</text>
<rect x="660" y="318" width="320" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="660" y="318" width="10" height="84" rx="5" fill="#0891b2"/>
<text x="820.0" y="345.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">AI pass</text>
<text x="820.0" y="367.0" text-anchor="middle" font-size="13.5" fill="#334155">sees only the evidence</text>
<text x="820.0" y="386.0" text-anchor="middle" font-size="13.5" fill="#334155">for that one answer</text>
<rect x="400" y="470" width="220" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="400" y="470" width="10" height="60" rx="5" fill="#7c3aed"/>
<text x="510.0" y="504.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">LLM check</text>
<rect x="720" y="464" width="260" height="74" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="850.0" y="495.5" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">A person looks it up</text>
<text x="850.0" y="517.5" text-anchor="middle" font-size="13.5" fill="#92400e">and fills it in</text>
<rect x="390" y="650" width="240" height="56" rx="12" fill="#0b1f3a" stroke="#0b1f3a" stroke-width="1.5"/>
<text x="510.0" y="682.0" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Final answer</text>
<rect x="238.8" y="219.0" width="42.4" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="260.0" y="236.0" text-anchor="middle" font-size="12.5" fill="#475569">sure</text>
<rect x="732.8" y="262.0" width="174.4" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="820.0" y="279.0" text-anchor="middle" font-size="12.5" fill="#475569">unsure, or nothing found</text>
<rect x="550.6" y="348.0" width="68.8" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="585.0" y="365.0" text-anchor="middle" font-size="12.5" fill="#475569">answered</text>
<rect x="799.1" y="421.0" width="101.8" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="850.0" y="438.0" text-anchor="middle" font-size="12.5" fill="#475569">still missing</text>
<rect x="232.6" y="488.0" width="134.8" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="300.0" y="505.0" text-anchor="middle" font-size="12.5" fill="#475569">1 in 20, at random</text>
<rect x="482.2" y="578.0" width="55.6" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="510.0" y="595.0" text-anchor="middle" font-size="12.5" fill="#475569">agrees</text>
<rect x="632.3" y="488.0" width="75.4" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="670.0" y="505.0" text-anchor="middle" font-size="12.5" fill="#475569">disagrees</text>
</svg>
