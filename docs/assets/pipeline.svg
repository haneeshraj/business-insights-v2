<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 850" width="1160" height="850" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">The pipeline, for one site</title>
<desc id="desc">Everything before the field specialists runs without a model; a specialist asks one only when the rules aren&#x27;t sure.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1160" height="850" fill="#f1f5f9"/>
<text x="40" y="52" font-size="26" font-weight="800" fill="#0b1f3a">The pipeline, for one site</text>
<text x="40" y="78" font-size="14" fill="#334155">Everything before the field specialists runs without a model; a specialist asks one only when the rules aren&#x27;t sure.</text>
<path d="M580.0 152.0 L580.0 190.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M820.0 246.0 L860.0 246.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
