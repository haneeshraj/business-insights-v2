<path d="M580.0 490.0 L580.0 540.0" fill="none" stroke="#475569" stroke-width="2"/>
<path d="M112.0 540.0 L1048.0 540.0" fill="none" stroke="#475569" stroke-width="2"/>
<path d="M112.0 540.0 L112.0 580.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M268.0 540.0 L268.0 580.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M424.0 540.0 L424.0 580.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M580.0 540.0 L580.0 580.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M736.0 540.0 L736.0 580.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M892.0 540.0 L892.0 580.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1048.0 540.0 L1048.0 580.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M112.0 644.0 L112.0 680.0" fill="none" stroke="#475569" stroke-width="2"/>
<path d="M268.0 644.0 L268.0 680.0" fill="none" stroke="#475569" stroke-width="2"/>
<path d="M424.0 644.0 L424.0 680.0" fill="none" stroke="#475569" stroke-width="2"/>
<path d="M580.0 644.0 L580.0 680.0" fill="none" stroke="#475569" stroke-width="2"/>
<path d="M736.0 644.0 L736.0 680.0" fill="none" stroke="#475569" stroke-width="2"/>
<path d="M892.0 644.0 L892.0 680.0" fill="none" stroke="#475569" stroke-width="2"/>
<path d="M1048.0 644.0 L1048.0 680.0" fill="none" stroke="#475569" stroke-width="2"/>
<path d="M112.0 680.0 L1048.0 680.0" fill="none" stroke="#475569" stroke-width="2"/>
<path d="M580.0 680.0 L580.0 720.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="430" y="100" width="300" height="52" rx="12" fill="#0b1f3a" stroke="#0b1f3a" stroke-width="1.5"/>
<text x="580.0" y="130.0" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">A website address</text>
<rect x="340" y="190" width="480" height="112" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="580.0" y="212.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Fetch</text>
<text x="580.0" y="234.0" text-anchor="middle" font-size="13.5" fill="#334155">the homepage, in a browser, with a screenshot;</text>
<text x="580.0" y="253.0" text-anchor="middle" font-size="13.5" fill="#334155">the contact page when the homepage lacks a phone,</text>
<text x="580.0" y="272.0" text-anchor="middle" font-size="13.5" fill="#334155">a general email or a street address;</text>
<text x="580.0" y="291.0" text-anchor="middle" font-size="13.5" fill="#334155">the privacy policy when no page gives a street address</text>
<rect x="860" y="196" width="260" height="100" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="990.0" y="221.5" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">A page that can&#x27;t be read</text>
<text x="990.0" y="243.5" text-anchor="middle" font-size="13.5" fill="#92400e">like one behind a bot check:</text>
<text x="990.0" y="262.5" text-anchor="middle" font-size="13.5" fill="#92400e">each field from what Wikidata</text>
<text x="990.0" y="281.5" text-anchor="middle" font-size="13.5" fill="#92400e">knows, or else an error</text>
<rect x="300" y="350" width="560" height="140" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="580.0" y="376.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Evidence, with no model</text>
<text x="580.0" y="398.5" text-anchor="middle" font-size="13.5" fill="#334155">structured data, title and meta tags, icons; logo candidates</text>
<text x="580.0" y="417.5" text-anchor="middle" font-size="13.5" fill="#334155">with their places on the screenshot; text by region;</text>
<text x="580.0" y="436.5" text-anchor="middle" font-size="13.5" fill="#334155">phones, emails, postcodes, links, country clues;</text>
<text x="580.0" y="455.5" text-anchor="middle" font-size="13.5" fill="#334155">the contact and privacy pages&#x27; details;</text>
<text x="580.0" y="474.5" text-anchor="middle" font-size="13.5" fill="#334155">and what Wikidata knows about the business</text>
<rect x="40" y="580" width="144" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="112.0" y="616.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Name</text>
<rect x="196" y="580" width="144" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="268.0" y="616.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Logo</text>
<rect x="352" y="580" width="144" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="424.0" y="616.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">MCC</text>
<rect x="508" y="580" width="144" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="580.0" y="606.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Address</text>
<text x="580.0" y="628.5" text-anchor="middle" font-size="13.5" fill="#334155">and coordinates</text>
<rect x="664" y="580" width="144" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="736.0" y="616.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Phone</text>
<rect x="820" y="580" width="144" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="892.0" y="616.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Email</text>
<rect x="976" y="580" width="144" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1048.0" y="616.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Social links</text>
<rect x="300" y="720" width="560" height="92" rx="12" fill="#0b1f3a" stroke="#0b1f3a" stroke-width="1.5"/>
<text x="580.0" y="751.0" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">SiteResult</text>
<text x="580.0" y="773.0" text-anchor="middle" font-size="13.5" fill="#cbd5e1">per field: the value, its status, confidence and source,</text>
<text x="580.0" y="792.0" text-anchor="middle" font-size="13.5" fill="#cbd5e1">the evidence behind it, and every step with its cost</text>
<rect x="354.2" y="503.0" width="451.6" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="580.0" y="520.0" text-anchor="middle" font-size="12.5" fill="#475569">all seven at the same time; their questions for Jev share one call</text>
</svg>
