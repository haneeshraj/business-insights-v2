<rect x="40" y="110" width="10" height="80" rx="5" fill="#16a34a"/>
<text x="66.0" y="144.5" text-anchor="start" font-size="16" font-weight="700" fill="#0b1f3a">1. Rules</text>
<text x="66.0" y="166.5" text-anchor="start" font-size="13.5" fill="#334155">places on the page that agree, structured data, postcodes</text>
<rect x="40" y="232" width="560" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="40" y="232" width="10" height="80" rx="5" fill="#0891b2"/>
<text x="66.0" y="266.5" text-anchor="start" font-size="16" font-weight="700" fill="#0b1f3a">2. Jev, a typed pick</text>
<text x="66.0" y="288.5" text-anchor="start" font-size="13.5" fill="#334155">among the rules&#x27; own candidates, with a probability for each</text>
<rect x="40" y="354" width="560" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="40" y="354" width="10" height="80" rx="5" fill="#7c3aed"/>
<text x="66.0" y="388.5" text-anchor="start" font-size="16" font-weight="700" fill="#0b1f3a">3. Gemini, a quoted reading</text>
<text x="66.0" y="410.5" text-anchor="start" font-size="13.5" fill="#334155">or a second opinion; what it reads must be on the page</text>
<rect x="40" y="476" width="560" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="40" y="476" width="10" height="80" rx="5" fill="#ea580c"/>
<text x="66.0" y="510.5" text-anchor="start" font-size="16" font-weight="700" fill="#0b1f3a">4. Investigator, a web search</text>
<text x="66.0" y="532.5" text-anchor="start" font-size="13.5" fill="#334155">for what the pages never say; its answer must cite its pages</text>
<rect x="40" y="598" width="560" height="60" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="320.0" y="632.0" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">needs_review, with the best answer kept</text>
<rect x="720" y="110" width="240" height="446" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="840.0" y="308.5" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">ok</text>
<text x="840.0" y="330.5" text-anchor="middle" font-size="13.5" fill="#166534">the value, its confidence,</text>
<text x="840.0" y="349.5" text-anchor="middle" font-size="13.5" fill="#166534">its source and the evidence,</text>
<text x="840.0" y="368.5" text-anchor="middle" font-size="13.5" fill="#166534">and every step that ran</text>
