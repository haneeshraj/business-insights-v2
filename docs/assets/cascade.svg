<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Each field&#x27;s cascade</title>
<desc id="desc">A field stops at the first step that&#x27;s sure. With no answer at all, it&#x27;s not found; nothing is guessed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1000" height="690" fill="#f1f5f9"/>
<text x="40" y="52" font-size="26" font-weight="800" fill="#0b1f3a">Each field&#x27;s cascade</text>
<text x="40" y="78" font-size="14" fill="#334155">A field stops at the first step that&#x27;s sure. With no answer at all, it&#x27;s not found; nothing is guessed.</text>
<path d="M600.0 150.0 L720.0 150.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
