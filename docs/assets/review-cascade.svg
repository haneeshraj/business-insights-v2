<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 630" width="980" height="630" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Turning evidence into answers</title>
<desc id="desc">Every field runs the same loop over its ways of finding the answer.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="980" height="630" fill="#f1f5f9"/>
<text x="40" y="52" font-size="26" font-weight="800" fill="#0b1f3a">Turning evidence into answers</text>
<text x="40" y="78" font-size="14" fill="#334155">Every field runs the same loop over its ways of finding the answer.</text>
<path d="M560.0 180.0 L560.0 230.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M440.0 260.0 L270.0 260.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M500.0 290.0 L500.0 320.0 L155.0 320.0 L155.0 350.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M620.0 290.0 L620.0 350.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M270.0 380.0 L420.0 380.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700.0 380.0 L820.0 380.0 L820.0 140.0 L770.0 140.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M440.0 410.0 L440.0 460.0 L185.0 460.0 L185.0 520.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M500.0 410.0 L500.0 520.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M680.0 410.0 L680.0 460.0 L800.0 460.0 L800.0 520.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="350" y="100" width="420" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="560.0" y="134.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Try the next way of finding the answer</text>
<text x="560.0" y="156.5" text-anchor="middle" font-size="13.5" fill="#334155">today: the page itself; later: AI models and search</text>
<rect x="440" y="230" width="240" height="60" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
<circle cx="462" cy="260.0" r="11" fill="#2563eb"/>
<text x="462" y="265.0" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">?</text>
<text x="575.0" y="264.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Got an answer?</text>
<rect x="40" y="230" width="230" height="60" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="155.0" y="264.0" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Accepted</text>
<rect x="40" y="350" width="230" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="155.0" y="384.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Keep the surest so far</text>
<rect x="420" y="350" width="280" height="60" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
<circle cx="442" cy="380.0" r="11" fill="#2563eb"/>
<text x="442" y="385.0" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">?</text>
<text x="575.0" y="384.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Any ways left to try?</text>
<rect x="40" y="520" width="290" height="76" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="185.0" y="552.5" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">Needs review</text>
<text x="185.0" y="574.5" text-anchor="middle" font-size="13.5" fill="#92400e">the best answer goes to an analyst</text>
<rect x="370" y="520" width="260" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="500.0" y="552.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Not found</text>
<text x="500.0" y="574.5" text-anchor="middle" font-size="13.5" fill="#334155">nothing is guessed</text>
<rect x="670" y="520" width="260" height="76" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
<text x="800.0" y="552.5" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">Error</text>
<text x="800.0" y="574.5" text-anchor="middle" font-size="13.5" fill="#991b1b">each failure is recorded</text>
<rect x="281.0" y="248.0" width="148.0" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="355.0" y="265.0" text-anchor="middle" font-size="12.5" fill="#475569">yes, and sure enough</text>
<rect x="242.8" y="308.0" width="174.4" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="330.0" y="325.0" text-anchor="middle" font-size="12.5" fill="#475569">yes, but not sure enough</text>
<rect x="559.2" y="308.0" width="121.6" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="620.0" y="325.0" text-anchor="middle" font-size="12.5" fill="#475569">no, or it failed</text>
<rect x="802.1" y="248.0" width="35.8" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="820.0" y="265.0" text-anchor="middle" font-size="12.5" fill="#475569">yes</text>
<rect x="226.0" y="448.0" width="148.0" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="300.0" y="465.0" text-anchor="middle" font-size="12.5" fill="#475569">no, but one was kept</text>
<rect x="439.2" y="473.0" width="121.6" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="500.0" y="490.0" text-anchor="middle" font-size="12.5" fill="#475569">no answer at all</text>
<rect x="739.2" y="478.0" width="121.6" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="800.0" y="495.0" text-anchor="middle" font-size="12.5" fill="#475569">every way failed</text>
</svg>
