<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">How we know an answer is right</title>
<desc id="desc">While analyzing, v2 can only say how sure it is; afterwards, checked answers say whether it was right.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1100" height="650" fill="#f1f5f9"/>
<text x="40" y="52" font-size="26" font-weight="800" fill="#0b1f3a">How we know an answer is right</text>
<text x="40" y="78" font-size="14" fill="#334155">While analyzing, v2 can only say how sure it is; afterwards, checked answers say whether it was right.</text>
<rect x="40" y="122" width="1000" height="176" rx="14" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="56" y="146" font-size="14" font-weight="700" fill="#0b1f3a">While analyzing: the truth isn&#x27;t known</text>
<rect x="40" y="350" width="1000" height="270" rx="14" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="56" y="374" font-size="14" font-weight="700" fill="#0b1f3a">Afterwards: was it right?</text>
<path d="M280.0 210.0 L330.0 210.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M670.0 210.0 L720.0 210.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M860.0 248.0 L860.0 324.0 L500.0 324.0 L500.0 461.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M320.0 438.0 L350.0 438.0 L350.0 481.0 L380.0 481.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M320.0 548.0 L350.0 548.0 L350.0 505.0 L380.0 505.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M620.0 493.0 L680.0 493.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1000.0 493.0 L1070.0 493.0 L1070.0 102.0 L500.0 102.0 L500.0 162.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="172" width="220" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="170.0" y="214.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Evidence from the page</text>
<rect x="330" y="162" width="340" height="96" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="500.0" y="195.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">How sure v2 is</text>
<text x="500.0" y="217.0" text-anchor="middle" font-size="13.5" fill="#334155">from how many independent places</text>
<text x="500.0" y="236.0" text-anchor="middle" font-size="13.5" fill="#334155">agree, and how clearly</text>
<rect x="720" y="172" width="280" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="860.0" y="214.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Accepted, or sent to review</text>
<rect x="60" y="400" width="260" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="190.0" y="432.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Gold-set answers</text>
<text x="190.0" y="454.5" text-anchor="middle" font-size="13.5" fill="#334155">confirmed by a person</text>
<rect x="60" y="510" width="260" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="190.0" y="542.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">The report page</text>
<text x="190.0" y="564.5" text-anchor="middle" font-size="13.5" fill="#334155">look at each logo</text>
<rect x="380" y="461" width="240" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="500.0" y="497.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Compare every answer</text>
<rect x="680" y="445" width="320" height="96" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="840.0" y="478.0" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Accuracy</text>
<text x="840.0" y="500.0" text-anchor="middle" font-size="13.5" fill="#166534">and how often an accepted</text>
<text x="840.0" y="519.0" text-anchor="middle" font-size="13.5" fill="#166534">answer was wrong</text>
<rect x="664.8" y="90.0" width="240.4" height="24" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="785.0" y="107.0" text-anchor="middle" font-size="12.5" fill="#475569">tune the weights and the threshold</text>
</svg>
