<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">The layers, and the rules between them</title>
<desc id="desc">Each arrow points to what a layer may import. import-linter checks the rules in CI, so a change that breaks one fails.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1000" height="600" fill="#f1f5f9"/>
<text x="40" y="52" font-size="26" font-weight="800" fill="#0b1f3a">The layers, and the rules between them</text>
<text x="40" y="78" font-size="14" fill="#334155">Each arrow points to what a layer may import. import-linter checks the rules in CI, so a change that breaks one fails.</text>
<path d="M380.0 190.0 L380.0 240.0 L230.0 240.0 L230.0 280.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M620.0 190.0 L620.0 240.0 L770.0 240.0 L770.0 280.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M230.0 390.0 L230.0 430.0 L380.0 430.0 L380.0 470.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M770.0 390.0 L770.0 430.0 L620.0 430.0 L620.0 470.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M420.0 335.0 L580.0 335.0" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="250" y="110" width="500" height="80" rx="12" fill="#0b1f3a" stroke="#0b1f3a" stroke-width="1.5"/>
<text x="500.0" y="144.5" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Entry points: cli, mcp, evaluation, wiring</text>
<text x="500.0" y="166.5" text-anchor="middle" font-size="13.5" fill="#cbd5e1">build a RunContext from real parts, and call the pipeline</text>
<rect x="40" y="280" width="380" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="40" y="280" width="10" height="110" rx="5" fill="#0891b2"/>
<text x="230.0" y="320.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Logic</text>
<text x="230.0" y="342.0" text-anchor="middle" font-size="13.5" fill="#334155">pipeline, resolvers, agent, evidence</text>
<text x="230.0" y="361.0" text-anchor="middle" font-size="13.5" fill="#334155">no I/O libraries: it reaches out through ports</text>
<rect x="580" y="280" width="380" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="580" y="280" width="10" height="110" rx="5" fill="#7c3aed"/>
<text x="770.0" y="320.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">Infrastructure</text>
<text x="770.0" y="342.0" text-anchor="middle" font-size="13.5" fill="#334155">fetch, llm, decide, retrieval, services, adapters</text>
<text x="770.0" y="361.0" text-anchor="middle" font-size="13.5" fill="#334155">implements the ports, and does the I/O</text>
<rect x="250" y="470" width="500" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="250" y="470" width="10" height="90" rx="5" fill="#16a34a"/>
<text x="500.0" y="500.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f3a">core</text>
<text x="500.0" y="522.0" text-anchor="middle" font-size="13.5" fill="#334155">models, ports, errors, settings, pure helpers</text>
<text x="500.0" y="541.0" text-anchor="middle" font-size="13.5" fill="#334155">imports nothing else from bi2, and no I/O libraries</text>
<rect x="452.4" y="314.0" width="95.2" height="42" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="500.0" y="331.0" text-anchor="middle" font-size="12.5" fill="#475569">never import</text>
<text x="500.0" y="349.0" text-anchor="middle" font-size="12.5" fill="#475569">each other</text>
</svg>
