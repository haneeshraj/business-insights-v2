name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and layer rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv has no moving major-version tag
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run lint-imports

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.14"]  # the oldest and newest supported versions
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv has no moving major-version tag
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest
